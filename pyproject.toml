[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pdf-chatbot"
version = "0.1.0"
description = "A citation-first PDF question-answering API with local retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.15,<0.16"]

[project.scripts]
pdf-chat = "pdf_chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_chatbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
